name: Deploy AI assistant (Cloudflare Worker)

# Deploys worker/ to Cloudflare and stores the Anthropic key as a Worker secret.
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — Cloudflare token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  — shown on the Cloudflare dashboard's Workers & Pages overview
#   ANTHROPIC_API_KEY      — from console.anthropic.com
# Re-runs whenever the worker or the portfolio data changes, so Claude's
# knowledge of the profile stays in sync with the site.

on:
  push:
    branches: ["main"]
    paths:
      - "worker/**"
      - "data/portfolio.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: "worker"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        working-directory: .
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "$ANTHROPIC_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping worker deploy: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and ANTHROPIC_API_KEY repository secrets to enable it."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      - name: Test
        if: steps.creds.outputs.ready == 'true'
        run: npm test

      - name: Deploy worker
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy | tee deploy.log

      - name: Set Anthropic key as worker secret
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY

      - name: Show worker URL
        if: steps.creds.outputs.ready == 'true'
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Worker URL: $URL"
          {
            echo "### AI assistant deployed"
            echo ""
            echo "Worker URL: \`$URL\`"
            echo ""
            echo "Set it as the repository **variable** \`ASK_API_URL\` (Settings → Secrets and variables → Actions → Variables), then re-run *Deploy to GitHub Pages*."
          } >> "$GITHUB_STEP_SUMMARY"
